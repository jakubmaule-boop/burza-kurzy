name: Kurzy
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: [fetch.py, symbols.json, .github/workflows/kurzy.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kurzy
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch.py
      - name: Commit
        run: |
          git config user.name "kurzy-bot"
          git config user.email "kurzy-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "kurzy $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -X ours || true
          git push
